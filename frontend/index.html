<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline SVG leaf favicon (GSM green), avoids missing-file 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M22 6c-7 0-12 5-12 12 0 2 .5 3.5 1 4.5C9 24 8 25 8 25s2 .5 4 .5c6 0 12-4 12-13 0-3-2-6.5-2-6.5z' fill='white'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GSM Trợ lý ẩm thực — gợi ý quán ăn phù hợp khẩu vị, ngân sách và tâm trạng của bạn." />
    <title>GSM · Trợ lý ẩm thực</title>

    <!-- Inter (Vietnamese subset) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply persisted/system theme before first paint — prevents flash of wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cust_theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
