# Dev B (Merchant Advisor) isolated stack — plan §[H6].
# Own Postgres + Redis, own ports/volumes → no data clobber, no §8.2 key collision.
# Usage: docker compose -f docker-compose.dev-b.yml up -d
version: '3.8'

services:
  db-dev-b:
    image: postgres:18-alpine
    container_name: vsf_dev_b_postgres
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-merchant_platform}
    volumes:
      - postgres_data_dev_b:/var/lib/postgresql/data

  redis-dev-b:
    image: redis:7-alpine
    container_name: vsf_dev_b_redis
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redis_data_dev_b:/data

volumes:
  postgres_data_dev_b:
  redis_data_dev_b:
