name: vsf-merchant-ai

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mem0:
    image: vsf-mem0-server
    restart: unless-stopped
    network_mode: host
    command: sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port ${MEM0_PORT:-8888}"
    environment:
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      APP_DB_NAME: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      POSTGRES_COLLECTION_NAME: ${POSTGRES_COLLECTION_NAME:?Set POSTGRES_COLLECTION_NAME in .env}
      
      LLM_PROVIDER: ${LLM_PROVIDER:?Set LLM_PROVIDER in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL in .env}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL:?Set MEM0_DEFAULT_LLM_MODEL in .env}
      MEM0_DISABLE_RESPONSE_FORMAT: ${MEM0_DISABLE_RESPONSE_FORMAT:?Set MEM0_DISABLE_RESPONSE_FORMAT in .env}
      
      MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:?Set MEM0_EMBEDDER_PROVIDER in .env}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:?Set EMBEDDER_MODEL in .env}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:?Set RAG_EMBEDDING_DIMENSIONS in .env}
      
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:?Set HF_HUB_OFFLINE in .env}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:?Set TRANSFORMERS_OFFLINE in .env}
      
      HF_HOME: /root/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /root/.cache/huggingface
      HISTORY_DB_PATH: ${HISTORY_DB_PATH:?Set HISTORY_DB_PATH in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_DISABLED: ${AUTH_DISABLED:?Set AUTH_DISABLED in .env}
      DASHBOARD_URL: ${DASHBOARD_URL:?Set DASHBOARD_URL in .env}
      MEM0_TELEMETRY: ${MEM0_TELEMETRY:?Set MEM0_TELEMETRY in .env}
    volumes:
      - mem0_history:/app/history
      - /home/minhnv63/.cache/llama_index:/root/.cache/huggingface/hub:ro
      - /home/minhnv63/.cache/llama_index:/root/.cache/llama_index:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${MEM0_PORT:-8888}/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  mem0-dashboard:
    image: vsf-mem0-dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${MEM0_DASHBOARD_PORT:-3000}
      NEXT_PUBLIC_API_URL: http://localhost:${MEM0_PORT:-8888}
      API_INTERNAL_URL: http://localhost:${MEM0_PORT:-8888}
      NEXT_PUBLIC_INSTANCE_NAME: VSF Merchant Memory
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${MEM0_DASHBOARD_PORT:-3000}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  mem0_history:
