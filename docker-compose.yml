version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gsm_merchant_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-merchant_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
