[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nguyen Van Minh", email = "minhnvm2307@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.11.0",
    "crawl4ai>=0.9.2",
    "crewai==1.15.5",
    "docling>=2.60,<3",
    "fastapi>=0.111.0",
    "h3>=4.5.0,<5",
    "httpx>=0.27.0",
    "langchain-community<0.4",
    "langfuse>=4.14.4",
    "llama-index-core>=0.14.23",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-vector-stores-postgres>=0.8.1",
    "openinference-instrumentation-crewai>=1.1.12",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "ragas>=0.4,<0.5",
    "redis>=5.0.0",
    "requests>=2.25.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
