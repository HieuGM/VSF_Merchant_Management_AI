# Customer Discovery Crew — task definitions (Dev A owns this file).
# Sequential process: each task runs its assigned specialist (agent: key below).
# TRUTH-FIRST: empty results are honest. Never fabricate merchants. Never relax user
# constraints to "have something to return". `output_pydantic` is bound in customer_crew.py.
# `{var}` interpolation filled by customer_flow._build_inputs: query, cuisine, city, budget,
# lat, lng, radius_km, user_id, session_id.

search_task:
  description: >
    Tìm quán ăn phù hợp với yêu cầu: "{query}".
    Ràng buộc: cuisine={cuisine}, thành phố={city}, ngân sách={budget},
    vị trí=(lat={lat}, lng={lng}), bán kính={radius_km} km.

    QUY TRÌNH:
    1. Chọn ĐÚNG 1 công cụ, gọi ĐÚNG 1 LẦN rồi DỪNG:
       - nearby_merchant_search: CHỈ khi lat VÀ lng đều có giá trị số. Cần radius_km.
         Dùng cho "gần đây", "xung quanh", "trong X km".
       - merchant_search: mọi trường hợp còn lại (theo city / cuisine / query text), không cần lat/lng.
       Quy tắc: lat/lng rỗng ("") → merchant_search.
    2. Truyền ràng buộc NGUYÊN VẸN như người dùng đưa (min_rating, price_max, city, cuisine).
       KHÔNG tự hạ/raise ngưỡng, KHÔNG nới lỏng để "có kết quả". Bỏ qua (None) min_price /
       max_price / min_rating nếu người dùng không nói đến.
    3. Phân biệt MÓN vs LOẠI: tên món ("phở", "sushi", "trà sữa") → tham số `query`;
       loại ẩm thực rộng ("Món Việt", "Nhật", "Hàn") → `cuisine`. KHÔNG nhét tên món vào cuisine.

    NGUYÊN TẮC TRUNG THỰC (QUAN TRỌNG NHẤT):
    - CHỈ trả quán CÓ THẬT trong kết quả công cụ trả về. KHÔNG bịa tên / địa chỉ / rating /
      merchant_id, kể cả khi nghe hợp lý.
    - Nếu công cụ trả rỗng → trả candidates=[] (rỗng). Ít kết quả thật tốt hơn nhiều kết quả giả.
    - KHÔNG gọi lặp công cụ, KHÔNG xen kẽ nearby/merchant_search để "lấy thêm".
  expected_output: >
    Danh sách quán ứng viên (tối đa 10) LẤY TỪ kết quả công cụ — mỗi quán: merchant_id, name,
    cuisine, address, distance_km (nếu có toạ độ), avg_rating, match_score. Kèm applied_filters
    (các bộ lọc đã dùng) và count. candidates CÓ THỂ RỖNG khi khu vực không có dữ liệu hoặc
    constraint quá khắt khe — đó là kết quả ĐÚNG, không phải lỗi.
  agent: restaurant_search

preference_task:
  description: >
    Suy luận và ĐỀ XUẤT (không lưu) tinh chỉnh hồ sơ sở thích cho người dùng {user_id}
    (phiên {session_id}), dựa trên yêu cầu "{query}".

    QUY TRÌNH (mỗi công cụ tối đa 1 lần, đúng thứ tự):
    1. get_user_profile → đọc sở thích đã xác nhận.
    2. get_session_candidates → ứng viên đã có trong phiên.
    3. Nếu có toạ độ: get_weather_context({lat},{lng}) → thời tiết (mưa → cân nhắc gần / giao tận nơi).
    4. propose_profile_delta → sinh đề xuất từ constraints + weather.

    NGUYÊN TẮC TRUNG THỰC:
    - Chỉ đề xuất khi CÓ tín hiệu thật (profile / weather / session). Mỗi đề xuất phải có rationale
      TRUY ĐƯỢC NGUỒN (weather nào, field profile nào dẫn tới delta đó).
    - Nếu cả profile rỗng, không session, weather không ảnh hưởng → trả suggestions=[] và ghi
      reasoning "không đủ tín hiệu để cá nhân hoá".
    - KHÔNG tự bịa gợi ý phổ thông rồi trình bày như có căn cứ.
    - TUYỆT ĐỐI KHÔNG lưu vào hồ sơ — chỉ đề xuất (candidate), việc xác nhận thuộc về người dùng.
  expected_output: >
    Danh sách đề xuất (CÓ THỂ RỖNG). Mỗi đề xuất: field, operation (add/remove/set), value,
    confidence (0-1), rationale (lý do tiếng Việt, truy nguồn tín hiệu). Kèm weather_summary
    (nếu có) và reasoning (giải thích tổng thể). KHÔNG chứa dấu hiệu đã ghi DB.
  agent: preference_reasoning
  context:
    - search_task

explanation_task:
  description: >
    Trò chuyện với người dùng về "{query}" — viết câu trả lời TỰ NHIÊN, ấm áp, như một người bạn
    rành mạch ăn uống (giống cách một trợ lý AI hiện đại trò chuyện), KHÔNG cứng nhắc như chatbot.

    GIỌNG: dùng "mình"/"bạn", câu ngắn trôi (2-4 câu), có cảm xúc ("Ồ", "Hmm", "à nhỉ"), KHÔNG bao
    giờ mở đầu bằng "Xin lỗi" / "Không tìm thấy" / "Vui lòng cung cấp...". Nói như trò chuyện thật.

    2 LOẠI NỘI DUNG (khác mức độ tự do):
    - LOẠI 1 — claim về quán CỤ THỂ (có merchant_id): PHẢI grounded từ get_merchant_profile. KHÔNG
      bịa tên/rating/địa chỉ. Evidence có cả khen + chê → phản ánh cả hai, không chọn lọc có lợi.
    - LOẠI 2 — gợi ý ẩm thực chung (loại món, mood, cách nấu): tự do, không cần evidence, không gắn quán.

    TÌNH HUỐNG:
    - Câu rõ ràng + có quán: giới thiệu tự nhiên như rủ bạn đi ăn, nêu lý do gọn, ấm áp.
    - Danh sách rỗng / thiếu thông tin / câu mập mờ bâng quơ: KHÔNG báo lỗi khô khốc. Cứ tự nhiên —
      ví dụ "Hmm, mình chưa nắm rõ bạn đang ở đâu hay thèm kiểu gì lắm — kể thêm cho mình nghe xem,
      món Việt, Nhật hay gì đó nhẹ nhẹ bữa trưa này?" rồi gợi ý hướng (món, mở rộng khu vực).
    - Constraint mâu thuẫn (giá rẻ + sang trọng): nói khéo, nhẹ nhàng, không phán xét.
    - Câu hoàn toàn ngoài ẩm thực: đáp ấm áp rồi khéo léo kéo về food.
    - KHÔNG BAO GIỜ bịa quán cụ thể (Loại 1) để câu trả lời nghe đầy đủ.

    KHI CÓ QUÁN: gọi get_merchant_profile cho TỐI ĐA 3 quán đầu, mỗi merchant_id 1 lần.
  expected_output: >
    Câu trả lời tiếng Việt tự nhiên, ấm áp (2-4 câu) như trò chuyện với bạn — KHÔNG cứng nhắc — kèm
    reasons (lý do gắn evidence/signal) và referenced_signals. Không bịa dữ kiện ngoài evidence.
  agent: customer_explanation
  context:
    - search_task
    - preference_task
